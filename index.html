<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Home Gym Rig - Final Build</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1e1e24; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-container { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(30, 30, 36, 0.9); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            border: 1px solid #444; 
            width: 280px; 
            max-height: 85vh;
            overflow-y: auto;
            backdrop-filter: blur(10px); 
            z-index: 100; 
        }

        h1 { margin: 0 0 10px 0; font-size: 1.1rem; color: #f39c12; }
        p { margin: 5px 0; font-size: 0.85rem; color: #ccc; }
        
        .dimension { display: flex; justify-content: space-between; margin-top: 5px; padding-top: 5px; border-top: 1px solid #444; font-size: 0.8rem; font-weight: bold; }
        
        .instruction { 
            margin-top: 15px; 
            font-size: 0.7rem; 
            color: #888; 
            border-top: 1px solid #333; 
            padding-top: 10px;
            font-style: italic;
        }

        button#toggle-ui { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; padding: 0; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; font-weight: bold; color: #f39c12; transition: opacity 0.5s ease; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">Loading 3D GYM Environment...</div>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 10px;">
            <h1 style="margin: 0;">Home Gym Rig</h1>
            <button id="toggle-ui">−</button>
        </div>
        <div id="ui-content">
            <p><strong>Mobile Optimized Build</strong></p>
            <div class="dimension"><span>Status:</span><span>Ready</span></div>
            <div class="dimension"><span>Interactions:</span><span>Tap Gear</span></div>
            
            <div class="instruction">
                • Tap Bench: Move to position<br>
                • Tap Lat Bar: Start pulldown<br>
                • Tap Spotters: Fold Safety Arms<br>
                • Tap Gear: Rack/Unrack
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            init3DScene();
            const toggleBtn = document.getElementById('toggle-ui');
            const uiContent = document.getElementById('ui-content');
            toggleBtn.addEventListener('click', () => {
                uiContent.style.display = uiContent.style.display === 'none' ? 'block' : 'none';
                toggleBtn.innerText = uiContent.style.display === 'none' ? '+' : '−';
            });
        };

        function init3DScene() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a35);
            scene.fog = new THREE.FogExp2(0x2a2a35, 0.0012);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(400, 280, 500);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 500);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 110, 50);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(200, 500, 300);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Materials
            const ironMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8, metalness: 0.3 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.2, metalness: 0.9 });
            const weightMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.8 });
            const cableMat = new THREE.LineBasicMaterial({ color: 0x666666 });
            const skinMat = new THREE.MeshStandardMaterial({color: 0xffcd94});
            const benchPadMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });

            const height = 250, distance = 150, width = 120, radius = 2.5, xOffset = width / 2;

            // Environment
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            scene.add(new THREE.GridHelper(1000, 20, 0x888888, 0x333333));

            const wall = new THREE.Mesh(new THREE.PlaneGeometry(1000, 500), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
            wall.position.set(0, 250, -radius);
            wall.receiveShadow = true;
            scene.add(wall);

            // Main Frame
            const frameGroup = new THREE.Group();
            [-1, 1].forEach(side => {
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 32), ironMat);
                pillar.position.set(side * xOffset, height / 2, distance);
                pillar.castShadow = true;
                frameGroup.add(pillar);

                for (let y = 30; y <= 220; y += 5) {
                    const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.5, 12), new THREE.MeshBasicMaterial({color: 0x000000}));
                    hole.rotation.x = Math.PI / 2;
                    hole.position.set(side * xOffset, y, distance + radius);
                    frameGroup.add(hole);
                }

                const wallConn = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, distance, 32), ironMat);
                wallConn.rotation.x = Math.PI / 2;
                wallConn.position.set(side * xOffset, height, distance / 2);
                frameGroup.add(wallConn);

                const wallExt = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 20, 32), ironMat);
                wallExt.rotation.z = Math.PI / 2;
                wallExt.position.set(side * (xOffset + 10), height, 0);
                frameGroup.add(wallExt);

                const baseFlange = new THREE.Mesh(new THREE.CylinderGeometry(radius * 3, radius * 3, 2, 32), ironMat);
                baseFlange.position.set(side * xOffset, 1, distance);
                frameGroup.add(baseFlange);
            });

            const midPipe = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width + 10, 32), ironMat);
            midPipe.rotation.z = Math.PI / 2;
            midPipe.position.set(0, height, distance / 2);
            frameGroup.add(midPipe);
            scene.add(frameGroup);

            // Interactive Rods
            const topRod = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width + 10, 32), ironMat);
            topRod.rotation.z = Math.PI / 2; topRod.position.set(0, height, distance);
            topRod.userData.type = 'rod'; topRod.userData.originalY = height;
            scene.add(topRod);

            const bottomRod = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width + 10, 32), ironMat);
            bottomRod.rotation.z = Math.PI / 2; bottomRod.position.set(0, 30, distance);
            bottomRod.userData.type = 'rod'; bottomRod.userData.originalY = 30;
            scene.add(bottomRod);

            // J-Cups
            const jCupHeight = 135;
            [-1, 1].forEach(side => {
                const jc = new THREE.Group();
                const wrap = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.3, radius + 0.3, 8, 32), ironMat);
                const hook = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 10), ironMat);
                hook.position.set(0, -2.5, 5);
                const lip = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 2), ironMat);
                lip.position.set(0, -1, 10);
                jc.add(wrap, hook, lip);
                jc.position.set(side * xOffset, jCupHeight, distance);
                scene.add(jc);
            });

            // Barbell
            const barbell = new THREE.Group();
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 200, 32), chromeMat);
            bar.rotation.z = Math.PI / 2;
            const wL = new THREE.Mesh(new THREE.CylinderGeometry(18, 18, 8, 32), weightMat); wL.rotation.z = Math.PI/2; wL.position.x = -85;
            const wR = new THREE.Mesh(new THREE.CylinderGeometry(18, 18, 8, 32), weightMat); wR.rotation.z = Math.PI/2; wR.position.x = 85;
            barbell.add(bar, wL, wR);
            barbell.position.set(0, jCupHeight + 4, distance + 8);
            barbell.userData.type = 'barbell'; barbell.userData.originalY = jCupHeight + 4; barbell.userData.originalZ = distance + 8;
            scene.add(barbell);

            // Spotters
            const spotters = [];
            [-1, 1].forEach(side => {
                const sGrp = new THREE.Group();
                sGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.3, radius + 0.3, 8, 32), ironMat));
                const arm = new THREE.Mesh(new THREE.BoxGeometry(5, 5, 55), ironMat); arm.position.z = 27.5;
                sGrp.add(arm);
                sGrp.position.set(side * xOffset, 85, distance);
                sGrp.userData.type = 'spotter';
                scene.add(sGrp);
                spotters.push(sGrp);
            });

            // Wall Dumbbells
            const wallDbs = [];
            const stomachY = 110;
            [-1, 1].forEach(side => {
                const u = new THREE.Group();
                u.add(new THREE.Mesh(new THREE.TorusGeometry(3, 0.8, 8, 16, Math.PI), ironMat));
                u.rotation.z = Math.PI; u.position.set(side * 35, stomachY, 5);
                scene.add(u);

                const db = new THREE.Group();
                db.add(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 12), ironMat).rotateZ(Math.PI/2));
                const plate = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 4), weightMat).rotateZ(Math.PI/2);
                const p1 = plate.clone(); p1.position.x = -5;
                const p2 = plate.clone(); p2.position.x = 5;
                db.add(p1, p2);
                db.position.set(side * 35, stomachY + 2, 5);
                db.userData.type = 'dumbbell'; db.userData.origX = side * 35;
                scene.add(db);
                wallDbs.push(db);
            });

            // Cable Pulley
            const pulleyCenterZ = distance / 2;
            const weightStack = new THREE.Mesh(new THREE.BoxGeometry(25, 60, 15), weightMat);
            weightStack.position.set(0, 30, pulleyCenterZ - 12);
            scene.add(weightStack);

            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 2, 16), ironMat);
            wheel.rotation.z = Math.PI / 2; wheel.position.set(0, height - 5, pulleyCenterZ);
            scene.add(wheel);

            const latBar = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 60, 32), ironMat);
            latBar.rotation.z = Math.PI / 2; latBar.position.set(0, height - 30, pulleyCenterZ + 25);
            latBar.userData.type = 'lat'; latBar.userData.active = false;
            scene.add(latBar);

            const barCableGeo = new THREE.BufferGeometry();
            const barCable = new THREE.Line(barCableGeo, cableMat);
            scene.add(barCable);
            const stackCableGeo = new THREE.BufferGeometry();
            const stackCable = new THREE.Line(stackCableGeo, cableMat);
            scene.add(stackCable);

            // --- WORKOUT BENCH ---
            const bench = new THREE.Group();
            const pad = new THREE.Mesh(new THREE.BoxGeometry(35, 8, 120), benchPadMat);
            pad.position.y = 45; pad.castShadow = true;
            bench.add(pad);
            const legGeo = new THREE.BoxGeometry(4, 45, 4);
            const legFL = new THREE.Mesh(legGeo, ironMat); legFL.position.set(-15, 22.5, 55); bench.add(legFL);
            const legFR = new THREE.Mesh(legGeo, ironMat); legFR.position.set(15, 22.5, 55); bench.add(legFR);
            const legBL = new THREE.Mesh(legGeo, ironMat); legBL.position.set(-15, 22.5, -55); bench.add(legBL);
            const legBR = new THREE.Mesh(legGeo, ironMat); legBR.position.set(15, 22.5, -55); bench.add(legBR);
            
            bench.position.set(0, 0, distance + 160);
            bench.userData.type = 'bench'; bench.userData.active = false;
            scene.add(bench);

            // --- HUMAN FIGURE (Standing) ---
            const human = new THREE.Group();
            const head = new THREE.Mesh(new THREE.SphereGeometry(10, 16, 16), skinMat); head.position.y = 161; human.add(head);
            const torso = new THREE.Mesh(new THREE.BoxGeometry(38, 50, 20), new THREE.MeshStandardMaterial({color: 0x34495e})); torso.position.y = 120; human.add(torso);
            [-1, 1].forEach(side => {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4, 70), skinMat);
                arm.position.set(side * 23, 110, 0); human.add(arm);
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(7, 5, 85), new THREE.MeshStandardMaterial({color: 0x2c3e50}));
                leg.position.set(side * 10, 45, 0); human.add(leg);
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(16, 10, 26), new THREE.MeshStandardMaterial({color: 0x111111}));
                shoe.position.set(side * 10, 5, 5); human.add(shoe);
            });
            human.position.set(0, 0, distance + 60);
            scene.add(human);

            // --- IMPROVED INTERACTION LOGIC (MOBILE COMPATIBLE) ---
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const interactive = [topRod, bottomRod, barbell, latBar, bench, ...spotters, ...wallDbs];

            let pointerDownPos = { x: 0, y: 0 };

            window.addEventListener('pointerdown', (e) => {
                pointerDownPos.x = e.clientX;
                pointerDownPos.y = e.clientY;
            });

            window.addEventListener('pointerup', (e) => {
                if (e.target.closest('#ui-container')) return;

                // Check if the pointer moved too much (distinguish tap from drag)
                const movementDist = Math.sqrt(Math.pow(e.clientX - pointerDownPos.x, 2) + Math.pow(e.clientY - pointerDownPos.y, 2));
                if (movementDist > 10) return; // Ignore if user was dragging/rotating

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const hits = raycaster.intersectObjects(interactive, true);
                
                if (hits.length > 0) {
                    let obj = hits[0].object;
                    while (obj.parent && !obj.userData.type) obj = obj.parent;
                    const type = obj.userData.type;

                    if (type === 'lat') obj.userData.active = !obj.userData.active;
                    if (type === 'spotter') {
                        const state = (obj.rotation.x === 0);
                        spotters.forEach(s => s.rotation.x = state ? Math.PI/2 : 0);
                    }
                    if (type === 'rod') obj.position.y = (obj.position.y === 5) ? obj.userData.originalY : 5;
                    if (type === 'barbell') {
                        obj.userData.active = !obj.userData.active;
                        obj.position.set(0, obj.userData.active ? 18 : obj.userData.originalY, obj.userData.active ? distance - 40 : obj.userData.originalZ);
                    }
                    if (type === 'dumbbell') {
                        const state = !wallDbs[0].userData.active;
                        wallDbs.forEach(d => {
                            d.userData.active = state;
                            d.position.set(d.userData.active ? (d.userData.origX > 0 ? 20 : -20) : d.userData.origX, d.userData.active ? 6 : stomachY + 2, d.userData.active ? distance - 20 : 5);
                        });
                    }
                    if (type === 'bench') obj.userData.active = !obj.userData.active;
                }
            });

            // Update cursor only on desktop
            window.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'mouse') {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(interactive, true);
                    document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                const targetBenchZ = bench.userData.active ? distance + 20 : distance + 160;
                bench.position.z += (targetBenchZ - bench.position.z) * 0.1;

                const targetLatY = latBar.userData.active ? height - 100 : height - 30;
                latBar.position.y += (targetLatY - latBar.position.y) * 0.1;
                const weightOffset = (latBar.userData.active ? 70 : 0);
                weightStack.position.y += (30 + weightOffset - weightStack.position.y) * 0.1;
                const pulleyPoint = new THREE.Vector3(0, height - 5, pulleyCenterZ);
                const barPoint = new THREE.Vector3(0, latBar.position.y, pulleyCenterZ + 25);
                const stackPoint = new THREE.Vector3(0, weightStack.position.y + 30, pulleyCenterZ - 12);
                barCable.geometry.setFromPoints([pulleyPoint, barPoint]);
                stackCable.geometry.setFromPoints([pulleyPoint, stackPoint]);

                renderer.render(scene, camera);
            }
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
